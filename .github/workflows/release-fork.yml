name: Release fork (macOS arm64)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major, explicit]
        default: patch
      version:
        description: Version (required when bump is explicit, e.g. 1.10.5)
        type: string
      require_signing:
        description: Fail if the signing certificate is missing
        type: boolean
        default: false
      dry_run:
        description: Build without pushing a commit/tag or creating a release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-fork
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      base_sha: ${{ steps.version.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Bump version, commit, and tag locally
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          case "$BUMP" in
            patch|minor|major)
              npm version "$BUMP" --no-git-tag-version
              ;;
            explicit)
              if [[ ! "$EXPLICIT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo '::error::Explicit version must be X.Y.Z without a v prefix'
                exit 1
              fi
              npm version "$EXPLICIT_VERSION" --no-git-tag-version
              ;;
            *) echo "::error::Unsupported bump: $BUMP"; exit 1 ;;
          esac
          version=$(node -p 'require("./package.json").version')
          tag="v$version"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore(release): $tag"
          git tag "$tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Push version commit and tag
        if: ${{ !inputs.dry_run }}
        run: git push --atomic origin HEAD:master "refs/tags/${{ steps.version.outputs.tag }}"
      - name: Pass versioned manifests to dry run jobs
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: release-manifests
          path: |
            package.json
            package-lock.json

  gate:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && needs.prepare.outputs.base_sha || needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Apply dry run version
        if: ${{ inputs.dry_run }}
        uses: actions/download-artifact@v4
        with:
          name: release-manifests
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild native modules for the runner's Node
        run: npm rebuild better-sqlite3
      - name: Run full test suite shard
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/tmp"
          export TMPDIR="$RUNNER_TEMP/tmp"
          log="$RUNNER_TEMP/test-shard-${{ matrix.shard }}.tap"
          node --import tsx --test --test-shard=${{ matrix.shard }}/4 --test-reporter=tap "test/**/*.test.js" 2>&1 | tee "$log"
          test_status=${PIPESTATUS[0]}
          read -r tests passed failed < <(awk '
            /^# tests [0-9]+$/ { tests = $3 }
            /^# pass [0-9]+$/ { passed = $3 }
            /^# fail [0-9]+$/ { failed = $3 }
            END { printf "%d %d %d\n", tests, passed, failed }
          ' "$log")
          echo "Shard ${{ matrix.shard }}/4: $tests tests, $passed passed, $failed failed (exit $test_status)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$tests" -eq 0 ]; then
            echo '::error::Test runner produced no test count'
            exit 1
          fi
          exit "$test_status"

  static-checks:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && needs.prepare.outputs.base_sha || needs.prepare.outputs.sha }}
      - name: Apply dry run version
        if: ${{ inputs.dry_run }}
        uses: actions/download-artifact@v4
        with:
          name: release-manifests
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check translations
        run: npm run i18n:check

  build-macos:
    needs: [prepare, gate, static-checks]
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      TARGET_ARCH: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && needs.prepare.outputs.base_sha || needs.prepare.outputs.sha }}
      - name: Apply dry run version
        if: ${{ inputs.dry_run }}
        uses: actions/download-artifact@v4
        with:
          name: release-manifests
      - name: Check signing requirements
        env:
          REQUIRE_SIGNING: ${{ inputs.require_signing }}
        run: |
          if [ "$REQUIRE_SIGNING" = true ] && [ -z "$CSC_LINK" ]; then
            echo '::error::Signing required: set MAC_CERTIFICATE_BASE64 and MAC_CERTIFICATE_PASSWORD'
            exit 1
          fi
          if [ -n "$CSC_LINK" ] && [ -z "$CSC_KEY_PASSWORD" ]; then
            echo '::error::MAC_CERTIFICATE_PASSWORD is required with MAC_CERTIFICATE_BASE64'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile macOS arm64 helpers
        run: |
          npm run compile:globe -- --arch arm64
          npm run compile:fast-paste -- --arch arm64
          npm run compile:media-remote -- --arch arm64
          npm run compile:audio-tap -- --arch arm64
          npm run compile:mic-listener
          npm run compile:calendar-listener
          npm run compile:window-bounds
          npm run compile:text-monitor
          npm run compile:mac-icon
      - name: Download macOS arm64 binaries
        run: |
          node scripts/download-whisper-cpp.js --current --platform darwin --arch arm64
          node scripts/download-llama-server.js --current --platform darwin --arch arm64
          node scripts/download-sherpa-onnx.js --current --platform darwin --arch arm64
          node scripts/download-yt-dlp.js --current --platform darwin --arch arm64
          node scripts/download-qdrant.js --current --platform darwin --arch arm64
          node scripts/download-meeting-aec-helper.js --current --platform darwin --arch arm64
          node scripts/download-whisper-vad-model.js
          node scripts/download-diarization-models.js --output-dir resources/bin/diarization-models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create empty bundled runtime env
        run: |
          # electron-builder.json includes .env as an extraResource.
          : > .env
      - name: Configure fork signing mode
        run: |
          # Change only the runner's copy. A null identity skips signing before
          # certificate lookup; signed builds discover the imported identity.
          node -e '
            const fs = require("node:fs");
            const file = "electron-builder.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            const signed = Boolean(process.env.CSC_LINK);
            if (signed) delete config.mac.identity;
            else config.mac.identity = null;
            delete config.mac.notarize;
            config.mac.forceCodeSigning = signed;
            fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
            console.log(`fork mac signing mode: ${signed ? "signed" : "unsigned"}; identity=${String(config.mac.identity)}; forceCodeSigning=${config.mac.forceCodeSigning}`);
          '
      - name: Import signing certificate
        if: env.CSC_LINK != ''
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo 'expected: base64 of a .p12 containing the code-signing identity and its private key (single line, no wrapping)'
          cleaned=$(printf '%s' "$CSC_LINK" | LC_ALL=C tr -d ' \t\r\n')
          if [ -z "$cleaned" ]; then
            echo '::error::MAC_CERTIFICATE_BASE64 is empty or whitespace-only'
            exit 1
          fi
          if [[ "$cleaned" =~ ^[A-Za-z0-9+/=]+$ ]]; then
            echo 'signing certificate secret shape: base64'
            if printf 'YQ==' | base64 --decode >/dev/null 2>&1; then
              decode_flag=--decode
            elif printf 'YQ==' | base64 -D >/dev/null 2>&1; then
              decode_flag=-D
            else
              echo '::error::The runner base64 command supports neither --decode nor -D'
              exit 1
            fi
            if ! printf '%s' "$cleaned" | base64 "$decode_flag" > "$CERTIFICATE_PATH" 2>/dev/null; then
              echo '::error::MAC_CERTIFICATE_BASE64 uses base64 characters but has invalid padding or is truncated'
              exit 1
            fi
          else
            echo 'signing certificate secret shape: raw'
            printf '%s' "$CSC_LINK" > "$CERTIFICATE_PATH"
          fi
          certificate_bytes=$(wc -c < "$CERTIFICATE_PATH" | tr -d ' ')
          echo "certificate bytes: $certificate_bytes"
          file -b "$CERTIFICATE_PATH"
          if [ "$certificate_bytes" -eq 0 ]; then
            echo '::error::MAC_CERTIFICATE_BASE64 decoded to an empty file'
            exit 1
          fi
          openssl_error="$RUNNER_TEMP/pkcs12-error.log"
          legacy_error="$RUNNER_TEMP/pkcs12-legacy-error.log"
          if openssl pkcs12 -in "$CERTIFICATE_PATH" -noout -passin "pass:$CSC_KEY_PASSWORD" 2> "$openssl_error"; then
            echo 'PKCS#12 validation passed'
          elif openssl pkcs12 -legacy -in "$CERTIFICATE_PATH" -noout -passin "pass:$CSC_KEY_PASSWORD" 2> "$legacy_error"; then
            echo 'PKCS#12 validation passed with legacy ciphers'
          else
            if grep -Eiq 'Mac verify error|mac verify failure|invalid password|bad decrypt|wrong password' "$openssl_error" "$legacy_error"; then
              echo '::error::MAC_CERTIFICATE_PASSWORD is wrong for this PKCS#12 certificate (OpenSSL MAC verification failed)'
            elif grep -Eiq 'asn1|wrong tag|header too long|not enough data|Expecting: PKCS12|unable to load PKCS12' "$openssl_error" "$legacy_error"; then
              echo '::error::MAC_CERTIFICATE_BASE64 is not a PKCS#12 file after decoding or raw import'
            else
              echo '::error::OpenSSL could not validate the PKCS#12 file; check its format, encryption, and password'
            fi
            echo 'OpenSSL diagnostics:'
            cat "$openssl_error" "$legacy_error"
            exit 1
          fi
          security create-keychain -p "runner" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "runner" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "runner" "$KEYCHAIN_PATH"
          identities=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")
          printf '%s\n' "$identities"
          preferred_identity=$(printf '%s\n' "$identities" | awk '/Developer ID Application:/ {print $2; exit}')
          first_identity=$(printf '%s\n' "$identities" | awk '/^[[:space:]]*[0-9]+\) [A-Fa-f0-9]+ "/ {print $2; exit}')
          identity=${preferred_identity:-$first_identity}
          if [ -z "$identity" ]; then
            echo '::error::The p12 contains no valid code signing identity'
            exit 1
          fi
          echo "Selected code signing identity: $identity"
          identity_cn=$(printf '%s\n' "$identities" | awk -v hash="$identity" '$2 == hash {sub(/^[^\"]*\"/, ""); sub(/\".*$/, ""); print; exit}')
          security find-certificate -c "$identity_cn" -p "$KEYCHAIN_PATH" | openssl x509 -noout -subject -enddate
      - name: Create draft release
        if: ${{ !inputs.dry_run }}
        run: gh release create "$RELEASE_TAG" --draft --target "${{ needs.prepare.outputs.sha }}" --title "$RELEASE_TAG" --notes "OpenWhispr $RELEASE_TAG (macOS arm64)"
      - name: Configure unsigned build
        if: env.CSC_LINK == ''
        run: echo 'CSC_IDENTITY_AUTO_DISCOVERY=false' >> "$GITHUB_ENV"
      - name: Build and upload macOS arm64 app
        if: ${{ !inputs.dry_run }}
        run: |
          # An empty CSC_LINK is treated as a certificate path by electron-builder.
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          npm run build:mac:arm64 -- --publish always
      - name: Build dry run artifact
        if: ${{ inputs.dry_run }}
        run: |
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          npm run build:mac:arm64 -- --publish never
      - name: Verify signing outcome
        run: |
          set -euo pipefail
          APP_PATH=$(ls -d dist/mac*/OpenWhispr.app | head -n1)
          if [ -n "$CSC_LINK" ]; then
            codesign --verify --deep --strict "$APP_PATH"
            echo "packaged signed: $APP_PATH"
          else
            echo "packaged unsigned: $APP_PATH"
          fi
      - name: Verify packaged macOS native binaries
        run: |
          APP_PATH=$(ls -d dist/mac*/OpenWhispr.app | head -n1)
          for bin in macos-audio-tap macos-globe-listener macos-fast-paste macos-mic-listener macos-calendar-listener macos-text-monitor macos-window-bounds macos-media-remote; do
            test -x "$APP_PATH/Contents/Resources/bin/$bin" || { echo "Missing in bundle: $bin"; exit 1; }
          done
          node scripts/verify-macos-parakeet.js "$APP_PATH"
      - name: Prepare arm64 update metadata
        run: |
          set -euo pipefail
          cp dist/latest-mac.yml dist/latest-arm64-mac.yml
          test -n "$(find dist -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*-mac.zip' -print -quit)"
      - name: Upload arm64 update metadata to draft
        if: ${{ !inputs.dry_run }}
        run: gh release upload "$RELEASE_TAG" dist/latest-arm64-mac.yml --clobber
      - name: Upload dry run artifact
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: openwhispr-${{ needs.prepare.outputs.version }}-mac-arm64
          path: |
            dist/*.dmg
            dist/*-mac.zip
            dist/latest-mac.yml
            dist/latest-arm64-mac.yml
          if-no-files-found: error
      - name: Check draft release assets
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets | node -e '
            const fs = require("fs");
            const release = JSON.parse(fs.readFileSync(0, "utf8"));
            const names = release.assets.map(asset => asset.name);
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(release.tagName) ||
                release.tagName !== process.env.RELEASE_TAG ||
                !release.isDraft || release.isPrerelease ||
                !names.includes("latest-arm64-mac.yml") ||
                !names.some(name => name.endsWith(".dmg")) ||
                !names.some(name => name.endsWith("-mac.zip"))) {
              console.error(`Invalid draft release ${release.tagName}: ${names.join(", ")}`);
              process.exit(1);
            }
          '
      - name: Publish release
        if: ${{ !inputs.dry_run }}
        run: gh release edit "$RELEASE_TAG" --draft=false
      - name: Remove signing keychain
        if: always() && env.CSC_LINK != ''
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/build_certificate.p12"
