name: Nightly full tests

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "::warning::npm ci failed (attempt $attempt of 3), retrying in 20s"
            sleep 20
          done
          echo '::error::npm ci failed after 3 attempts'
          exit 1
      - name: Rebuild native modules for the runner's Node
        run: npm rebuild better-sqlite3
      - name: Run full test suite shard
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/tmp"
          export TMPDIR="$RUNNER_TEMP/tmp"
          log="$RUNNER_TEMP/test-shard-${{ matrix.shard }}.tap"
          node --import tsx --test --test-shard=${{ matrix.shard }}/4 --test-reporter=tap "test/**/*.test.js" 2>&1 | tee "$log"
          test_status=${PIPESTATUS[0]}
          read -r tests passed failed < <(awk '
            /^# tests [0-9]+$/ { tests = $3 }
            /^# pass [0-9]+$/ { passed = $3 }
            /^# fail [0-9]+$/ { failed = $3 }
            END { printf "%d %d %d\n", tests, passed, failed }
          ' "$log")
          echo "Shard ${{ matrix.shard }}/4: $tests tests, $passed passed, $failed failed (exit $test_status)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$tests" -eq 0 ]; then
            echo '::error::Test runner produced no test count'
            exit 1
          fi
          exit "$test_status"
