name: Browser tests

on:
  push:
    branches: [master, main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci
      - name: Install Chromium for browser proofs
        timeout-minutes: 3
        run: npx playwright install chromium
      - name: Run browser proofs, including real Electron capture teardown
        timeout-minutes: 5
        run: node --test --test-concurrency=1 --test-timeout=120000 test/browser/*.cjs
